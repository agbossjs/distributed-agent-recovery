name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static Check, Build, Tests & Multi-Process Cluster Gate (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static AGBoss check, TypeScript & ESLint
        run: npm run check

      - name: Compile production artifacts
        run: npm run build

      - name: Run unit & workflow tests
        run: npm test

      - name: Run compiled multi-process cluster showcase & 8-invariant verifier
        run: |
          node dist/src/demo.js --cluster
          node dist/src/demo.js --verify-only
